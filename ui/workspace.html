<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grammar workspace</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="workspace.css">
  <script src="grammar-text.js" defer></script>
  <script src="workspace.js" defer></script>
  <script src="parse-trees.js" defer></script>
  <script src="workspace-analysis.js" defer></script>
</head>
<body>
  <h1 class="visually-hidden">Grammar workspace</h1>
  <div class="workspace">
    <section id="rules-panel" class="panel rules-panel" aria-labelledby="rules-heading">
      <header class="panel-header">
        <div class="panel-title">
          <h2 id="rules-heading">Rules</h2>
          <span id="rule-count" class="rule-count"></span>
        </div>
        <div class="panel-tools" role="group" aria-label="Rule actions">
          <button id="import-button" class="icon-button" type="button" aria-label="Import grammar file" title="Import grammar file">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.5v11"/><path d="m8 10.5 4 4 4-4"/><path d="M8.5 6.5H6a2 2 0 0 0-2 2V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8.5a2 2 0 0 0-2-2h-2.5"/></svg>
          </button>
          <button id="add-button" class="icon-button" type="button" aria-label="Add rule" title="Add rule">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          </button>
          <button id="delete-button" class="icon-button" type="button" aria-label="Delete rule" title="Delete selected rule" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 7h15"/><path d="M9.5 7V5a1.5 1.5 0 0 1 1.5-1.5h2A1.5 1.5 0 0 1 14.5 5v2"/><path d="m6.5 7 .8 11.6A2 2 0 0 0 9.3 20.5h5.4a2 2 0 0 0 2-1.9L17.5 7"/><path d="M10.25 11v5.5"/><path d="M13.75 11v5.5"/></svg>
          </button>
        </div>
        <p id="grammar-meta" class="grammar-meta"><span id="grammar-name" class="grammar-name"></span><span id="grammar-start" class="grammar-start"></span></p>
      </header>
      <div id="rule-scroll" class="panel-scroll">
        <ul id="rule-list" class="rule-list" role="listbox" aria-labelledby="rules-heading"></ul>
        <div id="empty-state" class="empty-state" hidden>
          <h3>No rules yet</h3>
          <p>Import a grammar file or add a rule to start.</p>
          <p class="empty-formats">Reads .cfg and .txt rule files and grammar .json. You can also drop a file here.</p>
        </div>
      </div>
      <div class="drop-overlay" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M12 3.5v11"/><path d="m8 10.5 4 4 4-4"/><path d="M8.5 6.5H6a2 2 0 0 0-2 2V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8.5a2 2 0 0 0-2-2h-2.5"/></svg>
        <span>Drop to import</span>
      </div>
      <div id="toast" class="toast" hidden>
        <p id="toast-text"></p>
        <button id="toast-undo" class="icon-button" type="button" aria-label="Undo" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button id="toast-close" class="icon-button" type="button" aria-label="Dismiss" title="Dismiss">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 7l10 10"/><path d="M17 7 7 17"/></svg>
        </button>
      </div>
      <input id="file-input" type="file" accept=".cfg,.txt,.json,.bnf,.grammar,text/plain,application/json" hidden>
    </section>

    <section id="approx-panel" class="panel approx-panel" aria-label="Approximation">
      <form id="approx-form" class="approx-form">
        <label for="approx-level">Approximate to level</label>
        <input id="approx-level" class="approx-level" type="number" min="1" max="30" step="1" value="6" inputmode="numeric" required>
        <button id="approx-next" class="icon-button" type="button" aria-label="Approximate one more level" title="One more level">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </button>
        <button id="approx-button" class="icon-button approx-run" type="submit" aria-label="Approximate" title="Approximate">
          <svg data-icon="run" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7.5 5.5v13l10-6.5z"/></svg>
          <svg data-icon="stop" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>
          <svg data-icon="again" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4.2h-4.2"/></svg>
        </button>
      </form>
      <div id="approx-readout" class="approx-readout" role="img" aria-label="">
        <p class="readout-line" aria-hidden="true">sentences of <span id="readout-start">S</span>: <span id="readout-sentences" class="readout-value">–</span></p>
        <p class="readout-line" aria-hidden="true">Ambiguities found: <span id="readout-ambiguities" class="readout-value">–</span></p>
        <p id="readout-status" class="readout-line readout-status" aria-hidden="true"></p>
      </div>
    </section>

    <section id="ambiguities-panel" class="panel ambiguities-panel" aria-labelledby="ambiguities-heading">
      <header class="panel-header">
        <div class="panel-title">
          <h2 id="ambiguities-heading">Ambiguities</h2>
          <span id="finding-count" class="rule-count"></span>
        </div>
      </header>
      <div id="ambiguity-scroll" class="panel-scroll">
        <ul id="ambiguity-list" class="ambiguity-list" role="listbox" aria-labelledby="ambiguities-heading"></ul>
        <div id="ambiguities-empty" class="empty-state">
          <h3 id="ambiguities-empty-title"></h3>
          <p id="ambiguities-empty-text"></p>
        </div>
      </div>
    </section>

    <section id="evidence-panel" class="panel evidence-panel" aria-labelledby="evidence-heading">
      <header class="panel-header">
        <div class="panel-title">
          <h2 id="evidence-heading">Evidence</h2>
        </div>
      </header>
      <div id="evidence-scroll" class="panel-scroll evidence-scroll">
        <div id="evidence"></div>
      </div>
    </section>
  </div>
  <div id="announcer" class="visually-hidden" role="status" aria-live="polite"></div>
</body>
</html>
